# hadolint 配置。
#
# 下面忽略的规则都是本项目的刻意选择, 逐条写明原因 ——
# 不是"懒得修", 而是照做反而会出问题。其它规则照常检查。
ignored:
  # DL3029: 不要给 FROM 加 --platform。
  # 这里必须加: 百度网盘客户端只有 amd64 版, 在 Apple Silicon 上靠 Rosetta 跑。
  # 不写死的话, arm64 机器构建出来的镜像装不上 amd64 的 .deb。
  - DL3029

  # DL3008: apt 包要钉版本号。
  # Debian 会把旧版本从归档里删掉, 钉死版本号会让构建在某天毫无预兆地失败,
  # 而且拿不到安全更新。基础镜像本身是钉住的 (debian:12-slim)。
  - DL3008

  # DL3025: HEALTHCHECK 要用 JSON 数组形式。
  # 这里要跑两条命令并组合 && / ||, shell 形式是唯一能写的。
  - DL3025

  # DL3066: USER 要用数字 uid。
  # baidu 是镜像里真实存在的用户 (uid 1000), 写名字可读性更好。
  - DL3066

  # SC2016: 单引号里的 $HOME 不会展开。
  # 这里恰恰不能展开: 写进 user-dirs.dirs 的必须是字面量 $HOME, 由读取方按用户展开。
  - SC2016
